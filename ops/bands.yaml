# Bands (specs/maintain.md, MNT-1, MNT-2): Towercab's own process metrics, judged by Western
# Electric rules once per completed period against [metrics].prometheus. Changed by PR only.
# Delta series are summed with sum_over_time (never rate/increase); each query gives one series.
# min_shift (absolute units): a rate moving less than this from its mean never breaches, however
# small σ is (sparse rates sit at 0 or 1 most periods).
bands:
  ci_failure_rate:
    metric: ci.result
    query: >-
      (sum(sum_over_time({__name__=~"towercab_ci_result(_total)?",result="red"}[1d])) or vector(0))
      / sum(sum_over_time({__name__=~"towercab_ci_result(_total)?"}[1d]))
    period: 1d
    baseline: rolling_30d
    rules: western_electric
    side: high
    min_shift: 0.05
    tiers:
      1sigma: {action: log}
      2sigma: {action: diagnose}
      3sigma: {action: propose, routes: [pull_request, runbook:pause]}

  cycle_time:
    metric: intent.duration
    query: >-
      histogram_quantile(0.5, sum by (le) (sum_over_time(
      {__name__=~"towercab_intent_duration(_seconds)?_bucket",kind="cycle",outcome="done"}[1d])))
    period: 1d
    baseline: rolling_30d
    rules: western_electric
    side: high
    tiers:
      1sigma: {action: log}
      2sigma: {action: diagnose}
      3sigma: {action: propose, routes: [pull_request]}

  cost_per_intent:
    metric: intent.cost
    query: >-
      histogram_quantile(0.5, sum by (le) (sum_over_time(
      {__name__=~"towercab_intent_cost(_USD)?_bucket"}[1d])))
    period: 1d
    baseline: rolling_30d
    rules: western_electric
    side: high
    tiers:
      1sigma: {action: log}
      2sigma: {action: diagnose}
      3sigma: {action: propose, routes: [pull_request, runbook:pause]}

  change_failure_rate:
    metric: escapes
    query: >-
      (sum(sum_over_time({__name__=~"towercab_escapes(_total)?",where="e2e"}[1w])) or vector(0))
      / sum(sum_over_time({__name__=~"towercab_intent_duration(_seconds)?_count",kind="lead",outcome=~"done|reverted|revert_failed"}[1w]))
    period: 1w
    baseline: rolling_182d
    rules: western_electric
    side: high
    min_shift: 0.05
    tiers:
      1sigma: {action: log}
      2sigma: {action: diagnose}
      3sigma: {action: propose, routes: [pull_request, runbook:pause]}

  eval_pass_rate:
    metric: eval.pass_rate
    query: >-
      max(last_over_time({__name__=~"towercab_eval_pass_rate(_ratio)?",kind="baseline"}[1d]))
    period: 1d
    baseline: rolling_182d
    rules: western_electric
    side: low
    min_shift: 0.05
    tiers:
      1sigma: {action: log}
      2sigma: {action: diagnose}
      3sigma: {action: propose, routes: [pull_request, runbook:pause]}

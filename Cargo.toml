[package]
name = "towercab"
version = "0.3.0"
edition = "2024"
description = "Majid's software factory: intents in, merged PRs out"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = "1.1.8"
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

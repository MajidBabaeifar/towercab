[package]
name = "towercab"
version = "0.3.0"
edition = "2024"
description = "Majid's software factory: intents in, merged PRs out"
publish = false

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.191"
regex = "1.13.1"
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "u64_digit"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.10.9", features = ["oid"] }
signal-hook = "0.4.5"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.28.0", features = ["v4"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
rand = "0.8.5"
tempfile = "3.27.0"

# Test keys are generated at test time (LOOP-19); unoptimized bignum math takes seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    name: "Checks: PR title, secrets, actions, dependencies"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/checks.yml

  sast:
    name: "SAST: CodeQL (public) or Semgrep CE (private)"
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sast.yml
    with:
      languages: actions,javascript-typescript

  check:
    name: "Node 22: lint, typecheck, tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  screenshots:
    name: "Playwright: UI screenshots"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: ui/screenshots/

  ci-ok:
    name: All required checks passed
    if: always()
    needs: [checks, sast, check, screenshots]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended $r"; exit 1 ;; esac
          done

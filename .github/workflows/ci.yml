name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# PIP-170: every job that runs steps has a time limit, so a hung job fails instead of running for GitHub's
# 6 hours. `checks` and `sast` call shared workflows, where `timeout-minutes` is not allowed on the caller;
# Towercab cancels and reruns a run that hangs (PIP-171).
jobs:
  checks:
    name: "Checks: PR title, secrets, actions, dependencies"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/checks.yml

  sast:
    name: "SAST: CodeQL (public) or Semgrep CE (private)"
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sast.yml
    with:
      languages: actions,javascript-typescript

  check:
    name: "Node 22: lint, typecheck, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PIP-132: the spec ID check needs the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: bwrap and its AppArmor profile
        # PIP-160, PIP-162: the escape suite always runs here, so a bwrap that is missing or can't start fails
        # the job. Ubuntu 24.04 restricts unprivileged user namespaces; the profile lets only this bwrap use
        # them, the restriction itself stays on.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo tee /etc/apparmor.d/towercab-bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile towercab-bwrap $(command -v bwrap) flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/towercab-bwrap
          bwrap --version
          bwrap --unshare-net --ro-bind / / true
      - run: npm ci
      - run: npm run check
      - name: Spec IDs against other open pull requests
        # PIP-132: no ID this PR adds may also be added by another open PR. A PR whose diff gh can't
        # show (too large) is left out of the comparison.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          : > "$RUNNER_TEMP/added.txt"
          for n in $(gh pr list --state open --json number --jq '.[].number'); do
            [ "$n" = "$PR" ] && continue
            { gh pr diff "$n" || true; } | { grep -oE '^\+### [A-Z]+-[0-9]+' || true; } | sed "s/^+### /$n /" >> "$RUNNER_TEMP/added.txt"
          done
          jq -Rn '[inputs | split(" ") | {number: (.[0] | tonumber), id: .[1]}] | group_by(.number) | map({number: .[0].number, ids: map(.id)})' "$RUNNER_TEMP/added.txt" > "$RUNNER_TEMP/prs.json"
          npm run towercab -- specs check-ids --base "origin/$BASE" --prs "$RUNNER_TEMP/prs.json"

  screenshots:
    name: "Playwright: UI screenshots"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: ui/screenshots/

  ci-ok:
    name: All required checks passed
    if: always()
    needs: [checks, sast, check, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended $r"; exit 1 ;; esac
          done

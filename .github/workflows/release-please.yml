# Calls the synced shared release workflow (release.yml); public repos can't call MajidBabaeifar/ci directly (REPO-9).
name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: "release-please: release PR, tag and GitHub release"
    # actions: write approves CI on the release PR; packages: write is for the shared workflow's image tagging (unused here, no app image).
    permissions:
      contents: write
      pull-requests: write
      actions: write
      packages: write
    uses: ./.github/workflows/release.yml

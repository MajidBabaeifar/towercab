# Synced from MajidBabaeifar/ci@5d4ee8802c76 .github/workflows/sast.yml; edit there, not here.
# CI-6: CodeQL on public repos (free), Semgrep CE on private ones.
name: sast

on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL languages, comma-separated (public repos)
        type: string
        default: actions

permissions: {}

jobs:
  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.languages }}
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  semgrep:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install semgrep==1.181.0 >/dev/null
      - run: semgrep scan --config p/default --error --metrics=off --quiet
